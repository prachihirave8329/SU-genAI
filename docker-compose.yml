
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jan-aushadhi-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/data/chroma_db
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: jan-aushadhi-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:

